name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        # prefer-lowest guards the minimum versions declared in composer.json
        dependencies: ['prefer-stable', 'prefer-lowest']
        include:
          # Minimums are the first releases with all known security advisories fixed
          - laravel: '12'
            constraint: '^12.71'
            testbench: '^10.0'
          - laravel: '13'
            constraint: '^13.40'
            testbench: '^11.0'
        exclude:
          # Laravel 13 requires PHP 8.3+
          - php: '8.2'
            laravel: '13'

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.constraint }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.dependencies }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  # Single, stable status check for the branch ruleset: it does not change when the matrix above does.
  tests-ok:
    name: Tests passed
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check the matrix result
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "Matrix result: $RESULT"
          [ "$RESULT" = "success" ]
